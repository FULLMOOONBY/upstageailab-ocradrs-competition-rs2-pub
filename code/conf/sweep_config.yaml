program: main.py
method: bayes  # bayes, random, grid 중 선택
metric:
  name: ndcg
  goal: maximize  # 최대화할 지표
parameters:
  model.als.num_factor:
    min: 8
    max: 128
  model.als.regularization:
    min: 0.0001
    max: 0.1
    distribution: log_uniform
  model.als.iterations:
    values: [5, 10, 15, 20]
  model.als.alpha:
    min: 0.1
    max: 40
    distribution: log_uniform